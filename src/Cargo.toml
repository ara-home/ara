[package]
name = "ara"
version = "0.7.0"
edition = "2021"
description = "A dependency manager with built-in security analysis"
license = "MIT"
repository = "https://github.com/ara-home/ara"
readme = "../README.md"
keywords = ["package-manager", "security", "javascript", "typescript"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
regex = "1"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
chrono = { version = "0.4", features = ["clock"] }
semver = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
nightly-bench = []

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "3" }
mockito = "1"

[lib]
path = "lib.rs"

[[bin]]
name = "ara"
path = "main.rs"

[[bench]]
name = "install_bench"
harness = false

[[bench]]
name = "resolver_bench"
harness = false

[[bench]]
name = "security_bench"
harness = false

[[bench]]
name = "util_bench"
harness = false

[[bench]]
name = "manifest_bench"
harness = false

[[bench]]
name = "lockfile_bench"
harness = false
