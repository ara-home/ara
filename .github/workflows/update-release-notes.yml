name: Update Release Notes

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # v2.81.8
        with:
          tool: git-cliff

      - name: Extract tag from plan
        id: tag
        run: |
          tag=$(echo '${{ inputs.plan }}' | jq -r '.announcement_tag')
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          git-cliff --config cliff.toml --tag "${{ steps.tag.outputs.tag }}" --strip header --latest > /tmp/release-notes.md

      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.tag.outputs.tag }}" \
            --notes-file /tmp/release-notes.md \
            --repo "${{ github.repository }}"
