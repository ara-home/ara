[package]
name = "ara"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
regex = "1"
walkdir = "2"
reqwest = { version = "0.12", features = ["blocking"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
libc = "0.2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]

[lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[bin]]
name = "ara"
path = "src/main.rs"
